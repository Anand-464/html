<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
</head>
<body>
    <h2>Calculator</h2>
    <input type="number" id="num_1" placeholder="First number">
    <select name="operator" id="operator">
        <option value="+">Addition</option>
        <option value="-">Subtraction</option>
        <option value="*">Multiplication</option>
        <option value="/">Division</option>
    </select>
    <input type="number" id="num_2" placeholder="Second number">
    <button onclick="calculate()">=</button>
    <p id="result"></p>

    <script>
        function add(a,b){
            return a+b;
        }
        function subtract(a,b){
            return a-b;
        }
        function multiply(a,b){
            return a*b;
        }
        function divide(a,b){
            return a/b;
        }
        function print(result){
            document.getElementById("result").innerHTML = "Answer is: "+result;
        }
        
        function calculate(){
            let num_1 = Number(document.getElementById("num_1").value);
            let num_2 = Number(document.getElementById("num_2").value);
            let operator = document.getElementById("operator").value;
            let result;

            switch(operator){
            case "+":
                result = add(num_1,num_2);
                break;
            case "-":
                result = subtract(num_1,num_2);
                break;
            case "*":
                result = multiply(num_1,num_2);
                break;
            case "/":
                result = divide(num_1,num_2);
                break;
            }
            try{
                if(operator==="/"&&(num_1===0||num_2===0)){
                    throw "0";
                }
            }
            catch(err){
                result = err;
            }
            print(result);
        }
        
    </script>
</body>
</html>
