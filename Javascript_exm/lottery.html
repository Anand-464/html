<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lottery</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
    
</head>
<body>
    <h2>Lottery draw</h2><br>
    <button onclick="pick()">Pick a winner</button><br><br>
    <p id="winner"></p>

    <div class="modal" tabindex="-1" id="popup">
        <div class="modal-dialog">
            <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">The winner is</h5>
                <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                <span aria-hidden="true">&times;</span>
                </button>
            </div>
            <div class="modal-body">
                <p id="popupWinner"></p>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-danger" data-dismiss="modal">Close</button>
            </div>
            </div>
        </div>
    </div>    

    <script>
        let lottNum =[10,45,78,9,50,1];
        
        function pick(){
            let randomIndex = Math.floor(Math.random() * lottNum.length);
            let winner = lottNum[randomIndex];

            console.log("Winner is: "+winner);

            document.getElementById("winner").innerHTML = "Winner is: "+winner;
            document.getElementById("winner").style.color = "red"

            document.getElementById("popupWinner").innerHTML = "Lottery number: "+winner;
            $('#popup').modal('show');
               
        }
    </script>
</body>
</html>
