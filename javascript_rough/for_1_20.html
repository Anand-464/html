<!--using for loop,while print numbers from 1-20
using for,while loop print numbers from 20-1-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let num=0;
        for(i=1;i<=20;i++){
            num=i;
            console.log(num);
        }
    </script>
</body>
</html>
