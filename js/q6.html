<!--display rest of the elements inside the array without duplication-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <p></p>
    <script>

        let arr = [1,2,3,4,5,5,6];
        let arr1 = [];
        let hasDuplicate = [];

        for(i=0;i<arr.length;i++){
            if(arr1.includes(arr[i])){
                hasDuplicate.push(arr[i]);
            }else{
                arr1.push(arr[i]);
            }
        }
        document.write(arr1);
        document.write(hasDuplicate);
        console.log(arr1);
        console.log(hasDuplicate)
    </script> 
</body>
</html>
