<!--reverse pattern-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let num = Number(prompt("enter a number"));
        let c = 0;
        for(i=num; i>=1; i--){
            let pattern = "";
            for(j=i; j>=1; j--){
                pattern += c;
                c++;
            }
            console.log(pattern);
        }
    </script>
</body>
</html>
