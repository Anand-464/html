<!--sum of a number(eg:123=1+2+3)-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let num = Number(prompt("Enter a number:"));
        let sum = 0;
        while(num > 0){
            let digit = num%10;
            num = Math.floor(num/10);
            sum += digit;
        }
        console.log(`Sum of digits: ${sum}`);
    </script>
</body>
</html>
