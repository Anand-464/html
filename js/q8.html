<!--prime numbers in a range-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let start = 1;
        let end = 50;
        for(i = start;i <= end;i++){
            let result = 0;
            for(j = 2;j < i;j++){
                if(i % j==0){
                    result = 1;
                    break
                }
            }
            if (i > 1 && result == 0) {
                console.log(i);
            }
        }
    </script>

</body>
</html>
