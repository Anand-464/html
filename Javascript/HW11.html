<body>
    <script>
        class user{
            constructor(name,age,email){
                this.name = name;
                this.age = age;
                this.email = email;
            }
            getName(){
                return this.name;
            }
            getAge(){
                return this.age;
            }
            getEmail(){
                return this.email;
            }
            setEmail(email){
                if(email.includes("@")){
                    this.email = email;
                    console.log("updated");
                }else{
                    console.log("invalid");
                }
            }
        }
        let user1 = new user("john",30,"abc@gmail.com");
        user1.setEmail("defg@gmail.com");
        user1.setEmail("defggmail.com");

        console.log("name: ",user1.getName());
        console.log("age: ",user1.getAge());
        console.log("email: ",user1.getEmail());
    </script>
