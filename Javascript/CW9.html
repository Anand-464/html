<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>comment system</title>
</head>
<body>
    <script>
        var str = "My son is 12 years old. Our flat number is 45 and contact is 9876543210";
        var pat = /[0-9]/.test(str);
        console.log(str);
        if(pat){
            var newStr = str.replace(/[0-9]+/g,"NUMBER");
            console.log(newStr);
        }
        console.log(`Is there any numbers? ${pat}`)
        
    </script>
</body>
</html>
